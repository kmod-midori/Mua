[project]
name = "mua-server"
version = "0.2.0"
description = "Central MCP gateway for mua devices"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "mcp>=1.26,<2", "uvicorn[standard]>=0.34,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
