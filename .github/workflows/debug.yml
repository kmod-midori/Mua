name: Debug

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - name: Restore Firebase configuration when available
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.MUA_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            umask 077
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > mua/src/google/google-services.json
          fi
      - name: Build and test available variants
        run: ./gradlew :app:assembleDebug :mua:assembleDebug :app:testDebugUnitTest :mua:test :display-control:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            mua/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
          python-version: '3.14'
      - name: Test and lint
        working-directory: server
        run: |
          uv sync --locked
          uv run --no-sync pytest -q
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: server
          push: false
          cache-from: type=gha,scope=mua-server
          cache-to: type=gha,mode=max,scope=mua-server
